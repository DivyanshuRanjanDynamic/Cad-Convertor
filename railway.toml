# railway.toml — Railway project configuration
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 180   # OCCT warm-up can take ~30-60s on first start
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Raise to 2 only once production's GET /health reports "jobStore": "firestore".
# With the in-memory store, a /status poll that reaches the other replica can't
# find the job. Needs FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL and
# FIREBASE_PRIVATE_KEY set on this service (see README → Deployment).
numReplicas = 1

[deploy.resources]
cpu = 2
memory = "2GB"
